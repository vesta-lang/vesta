[package]
name        = "reader_bmp"
version     = "1.0.0"
authors     = ["VestaVM team"]
license     = "MIT"
edition     = 1

[capabilities]
# Lee y ESCRIBE el fichero BMP via vx_fileio (kernel32 en Windows, libc en
# POSIX) y parsea el flag -r WxH via el plugin nativo vesta_io.  Sin red.
declared = ["fs:read", "fs:write", "ffi:call=kernel32.dll", "ffi:call=libc.so.6"]

# Sin dependencias externas: usa la stdlib (vx_fileio) y builtins del lenguaje.
[dependencies]

[scripts]
# Build hiper-sencillo: compila la version MODULAR (main.vx importa bmp.vx
# + vx_fileio) a reader_bmp.velb.  Un solo comando: `vesta pkg run build`.
build = "vesta --vx main.vx -o reader_bmp"

# Ejecuta el .velb sobre la imagen de ejemplo sin padding (60x3).  El `--`
# separa los argumentos del programa de los flags de la VM.
run   = "vesta --run reader_bmp.velb -- Ejemplo60x3.bmp"

# Igual pero sobre la imagen con padding de fila (3x60), para validar el
# manejo del padding a multiplo de 4 bytes por fila.
run-padded = "vesta --run reader_bmp.velb -- Ejemplo3x60.bmp"

# Ejecuta mostrando estadisticas (instrucciones, MIPS, GC).
stats = "vesta --run reader_bmp.velb --stats -- Ejemplo60x3.bmp"

# Ejecuta con el JIT activo (path vreg de produccion).
jit   = "vesta --run reader_bmp.velb -m jit -- Ejemplo60x3.bmp"

# Compilacion nativa AOT (PE en Windows / ELF en Linux) de la variante
# single-file.  Los metodos de clase cross-modulo ya compilan a AOT (BUG-5
# cerrado); la variante MODULAR completa aun necesita `args_get` en AOT (LIM-5)
# para leer el nombre del fichero -- ver BUGS_LIMITACIONES.md.
aot   = "vesta -m aot --vx reader_bmp.vx -o reader_bmp_native --emit exe"

# --- Escritura de BMP (overlays + funciones libres, sin clases) ---
# Crea una imagen 8x8 24bpp con un gradiente, la escribe a disco, la relee y
# verifica el round-trip.  main devuelve 42 en exito.
write        = "vesta --vx writer_bmp.vx -o writer_bmp"
write-run    = "vesta --run writer_bmp.velb -m vm"
write-jit    = "vesta --run writer_bmp.velb -m jit"
# AOT nativo del writer (PE).  El ejecutable devuelve 42 como exit-code.
write-aot    = "vesta -m aot --vx writer_bmp.vx -o writer_bmp_native --emit exe"
