# El que mas ayuda: lo que se PIERDE por no declarar, con lo que hay que
# escribir para recuperarlo.  Sin esto, el programador no tenia forma de saber
# que una palabra suya cambia el codigo que sale de su funcion.
["param.regions_not_provably_distinct"]
en = "{2} pointer parameters do not say whether their region is their own, so none of them can be taken as distinct from another: inside this function no read may move ahead of a write, and a field-by-field copy cannot be reduced to a block operation. Declaring the direction (`out` / `in` / `inout`), or using a type that already guarantees it (`unique<T>`), recovers it"
es = "{2} parametros puntero no dicen si su region es suya, asi que ninguno se puede dar por distinto de otro: dentro de esta funcion ninguna lectura puede adelantar a una escritura, y una copia campo a campo no se reduce a una operacion de bloque.  Declarar la direccion (`out` / `in` / `inout`), o usar un tipo que ya lo garantice (`unique<T>`), lo recupera"

# --- lo que se sabe MIRANDO LAS LLAMADAS ---
# Pedirle al programador que declare sin haber mirado los sitios de llamada es
# derrotista: en la llamada se ven los argumentos, y ahi casi siempre se sabe.
["param.call_site_overlaps"]
en = "at this call the arguments for parameters {0} and {1} ARE the same memory, or overlap. This is a fact about the program, not a limit of the analysis: declaring the direction would not fix it, it would make the declaration false"
es = "en esta llamada los argumentos de los parametros {0} y {1} SI son la misma memoria, o se solapan.  Es un dato del programa, no un limite del analisis: declarar la direccion no lo arreglaria, la haria falsa"

["param.disjoint_in_all_calls"]
en = "parameters {0} and {1} never receive overlapping regions: every call is visible and none of them does. Nothing needs declaring here"
es = "los parametros {0} y {1} no reciben nunca regiones que se solapen: todas las llamadas se ven y ninguna lo hace.  Aqui no hay nada que declarar"

["param.disjoint_in_seen_calls"]
en = "in every call SEEN, parameters {0} and {1} receive disjoint regions -- but the function is public, so there may be others. Declaring the direction makes it hold for all of them"
es = "en todas las llamadas QUE SE VEN, los parametros {0} y {1} reciben regiones disjuntas -- pero la funcion es publica, asi que puede haber otras.  Declarar la direccion lo hace valer para todas"

["param.call_site_undecidable"]
en = "it could not be decided whether parameters {2} receive overlapping regions: some call passes an address whose root is not resolved. Declaring the direction (`out` / `in` / `inout`), or a type that guarantees it (`unique<T>`), settles it without looking at the calls"
es = "no se pudo decidir si los parametros {2} reciben regiones que se solapen: alguna llamada pasa una direccion cuya raiz no se resuelve.  Declarar la direccion (`out` / `in` / `inout`), o un tipo que lo garantice (`unique<T>`), lo zanja sin mirar las llamadas"

