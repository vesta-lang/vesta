# ===========================================================================
# VXW -- HALLAZGOS DEL LINTER
# ===========================================================================
#
# Familia propia, separada de los errores (VXE) y de los avisos del analisis
# (VXA), y por una razon que se nota al usarla: un hallazgo del linter NO dice
# que el programa este mal.  Dice que hay una decision que tomar, y la toma una
# persona.  Mezclarlos haria imposible apagar lo segundo sin apagar lo primero.
#
# Regla de esta familia: la ACCION va DENTRO del mensaje.  Un hallazgo que solo
# describe -- "este contrato no se comprueba" -- deja al lector buscando que
# hacer; con el que hacer al lado se arregla en el momento.

# --- un contrato que nadie esta comprobando (VXW001) ---
#
# El verificador de contratos tiene tres veredictos -- se cumple, NO se cumple,
# no se puede decidir -- y hasta ahora los tres sitios que lo consumian hacian
# lo mismo: quedarse solo con el segundo.  Un contrato indecidible se descartaba
# EN SILENCIO, y entonces parecia comprobado porque nadie protestaba.
#
# Eso es peor que no tenerlo: miente con autoridad.  Alguien lee `@nothrow` y
# construye encima algo que da por hecho que no lanza.

[VXW001]
en = "the contracts of '{0}' ({1}) are NOT being verified: {2} -- a contract is a CHECK, so one that cannot be checked promises without guarding anything: keep it as documented intent, or drop it, but do not read it as proven"
es = "los contratos de '{0}' ({1}) NO se estan verificando: {2} -- un contrato es una COMPROBACION, asi que uno que no se puede comprobar promete sin guardar nada: dejalo como intencion documentada, o quitalo, pero no lo leas como demostrado"

# --- una cota mas floja que la demostrada (VXW002) ---
#
# Sugerencia CON EL VALOR PUESTO: no se dice "podrias apretar esto", se dice el
# numero que el analisis demostro.  El arreglo lo firma el humano porque una
# cota es una promesa hacia fuera, y prometer menos de lo que hoy cumples puede
# ser deliberado -- dejar margen para cambiar la implementacion.

[VXW002]
en = "'{0}' declares {1}({2}) and only {3} was proven -- tightening it makes the promise say what the code really does"
es = "'{0}' declara {1}({2}) y solo se demostro {3} -- apretarlo hace que la promesa diga lo que el codigo hace de verdad"

# --- una propiedad demostrada y sin declarar (VXW003) ---
#
# Solo en funciones que YA declaran algun contrato: quien escribio uno ha
# decidido que esta funcion tiene una promesa que mantener.  Ofrecerselo a toda
# funcion que no lance seria ruido -- casi ninguna lanza --, y un linter ruidoso
# se apaga entero, y apagado no protege de nada.

[VXW003]
en = "'{0}' provably satisfies {1} and does not declare it -- declaring it turns today's fact into a promise the compiler will enforce"
es = "'{0}' cumple {1} de forma demostrable y no lo declara -- declararlo convierte un hecho de hoy en una promesa que el compilador hara cumplir"

# --- lo que el propio linter dice de si mismo (VXW900-VXW902) ---
#
# Tambien por el catalogo, y no como texto suelto en el codigo.  Un subcomando
# que habla en espanol mientras sus hallazgos salen en el idioma de quien
# compila es un subcomando a medias, y la mitad que falta es justo la que se ve
# cuando algo va mal.

[VXW900]
en = "cannot open '{0}'"
es = "no se puede abrir '{0}'"

[VXW901]
en = "'{0}' produced no IR to look at (check the diagnostics above)"
es = "'{0}' no dejo IR que mirar (revisa los diagnosticos de arriba)"

[VXW902]
en = "no findings: the linter only speaks about what it can prove"
es = "sin hallazgos: el linter solo habla de lo que puede demostrar"

# --- un contrato incumplido (VXT004) ---
#
# Esto SI es un error: el programa promete algo que el compilador ha demostrado
# que no cumple.  Iba como prosa espanola incrustada en TRES sitios del
# compilador; ahora sale del catalogo, como todo, y de un solo sitio.

[VXT004]
en = "'{0}' declares {1} and provably breaks it: {2}"
es = "'{0}' declara {1} y esta demostrado que no lo cumple: {2}"

# --- lo que cuesta una frontera (VXW004) ---
#
# La unica familia del linter que puede CUANTIFICAR lo que pierdes: cuantas
# funciones se quedan sin demostrar sus efectos por UNA frontera, y cual es.
# El compilador lo sabe -- lo acaba de decidir al componer el cierre --, y
# nombrarla es lo que evita que el aviso sea un callejon sin salida.
#
# OJO CON EL VERBO.  Esto NO le pide al usuario que declare nada: los efectos
# del codigo Vesta los DEDUCE el compilador, y esa es la promesa del lenguaje.
# Lo que pasa aqui es que el cierre SALE del programa -- una funcion del
# sistema o por FFI -- y ahi no hay codigo que leer; poder declararlos para ese
# caso es algo que aun no existe.  Redactarlo como "declara los efectos" seria
# mandar al usuario a hacer un trabajo que no le toca y que hoy no puede hacer.
#
# Y no se calla ninguna frontera, ni las de la stdlib.  Que la frontera sea
# NUESTRA es la informacion mas util de todas: dice que declarar los efectos de
# la stdlib desbloquearia a todo el mundo a la vez.

[VXW004]
en = "{0} function(s) here cannot prove their effects (@pure, @nothrow, @nopanic, @alloc, @stack) because their call closure leaves the program at '{1}' -- the compiler derives effects from Vesta code, and there is none to read there; a contract would not help, since a contract CHECKS what was derived and never feeds it (first one: '{2}')"
es = "{0} funcion(es) de aqui no pueden demostrar sus efectos (@pure, @nothrow, @nopanic, @alloc, @stack) porque su cierre de llamadas sale del programa por '{1}' -- el compilador deduce los efectos del codigo Vesta, y ahi no hay codigo que leer; un contrato no ayudaria, porque un contrato COMPRUEBA lo deducido y nunca lo alimenta (la primera: '{2}')"

