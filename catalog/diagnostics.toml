# --- los hallazgos de esas dos familias ---
#
# `params.unused` habla de un PARAMETRO y no de cualquier valor sin usar: un
# valor SSA sin usos es lo normal a mitad de una optimizacion y avisarlo seria
# ruido, mientras que un parametro lo escribio alguien y se pasa en cada
# llamada.
#
# `memory.not_localizable` NO acusa: que el compilador no sepa a donde apunta
# algo es legitimo.  Dice donde se pierde conocimiento, que es donde se pierden
# tambien las optimizaciones que dependen de saber que no se pisa nada.

[VXW006]
en = "'{0}' is a parameter of '{1}' that nobody reads -- either it is not needed, or it was meant to be used and is not"
es = "'{0}' es un parametro de '{1}' que nadie lee -- o sobra, o se penso usarlo y no se uso"

[VXW007]
en = "'{1}' touches memory at {0} place(s) where the compiler cannot tell WHERE -- that is not an error, but every one of them takes with it the optimizations that need to know nothing else is being overwritten"
es = "'{1}' toca memoria en {0} sitio(s) donde no se puede saber DoNDE -- no es un error, pero cada uno se lleva por delante las optimizaciones que necesitan saber que no se pisa nada"

# --- y lo que la familia NO puede decidir, dicho ---
#
# Callarse no es una opcion: quien lee la salida no puede distinguir "aqui esta
# todo bien" de "aqui no he mirado".  Un analisis que renuncia sin decir por que
# parece que funciona.

# --- los hallazgos de la familia de bucles ---
#
# Las vueltas salen del analisis de induccion (con los rangos de segunda
# fuente) y llegan aqui SELLADAS: la familia solo mira las demostradas, porque
# acusar de codigo muerto a partir de una inferencia que pudo pararse por
# presupuesto seria acusar sin prueba.

# Los tres van SIN el nombre de la funcion, y no es un olvido: el inline copia
# el cuerpo en sus llamantes, asi que un bucle escrito UNA vez se reconoce en
# varias funciones y decir en cual es decir una al azar.  La POSICION apunta a
# la linea del bucle, que es donde el usuario puede arreglarlo, y no miente.
[VXW916]
en = "the body of this loop never runs: its count is proven to be zero -- usually a limit that fell below the start, or a '<' where '<=' was meant"
es = "el cuerpo de este bucle no se ejecuta nunca: sus vueltas estan demostradas y son cero -- suele ser un limite que quedo por debajo del inicio, o un '<' donde iba '<='"

[VXW917]
en = "this loop runs exactly once, so it does not loop: it reads as if it repeated and it does not"
es = "este bucle da exactamente una vuelta, asi que no es un bucle: se lee como si repitiera y no repite"

# `memory.bulk_by_hand`.  Solo sobre lo DEMOSTRADO: el bucle es exactamente un
# relleno o una copia de un tramo contiguo.  No se avisa de los que casi lo son
# -- ahi la lista de "casi" seria una lista escrita a mano, y esas se quedan
# viejas en silencio.
# NO llevan el nombre de la funcion, y no es un olvido: el inline copia el
# cuerpo en sus llamantes, asi que un bucle escrito una vez queda reconocido en
# dos o tres funciones y decir en cual es decir una de ellas al azar.  La
# POSICION no miente: apunta a la linea del bucle, que es donde el usuario
# puede arreglarlo.
# El bucle cuya guarda `!=` no cae nunca en el limite.  El mensaje es PRECISO
# a proposito: con un paso impar el bucle si termina, despues de recorrer el
# tipo entero.  Decir "no termina" a secas seria mas comodo y falso, y quien
# lo comprobara dejaria de fiarse del resto.
[VXW920]
en = "this loop advances past its limit without ever equalling it, so its '!=' guard never stops it: it either does not end, or ends only after wrapping around the whole type"
es = "este bucle se pasa de su limite sin llegar a igualarlo nunca, asi que su guarda '!=' no lo para: o no termina, o solo termina tras dar la vuelta al tipo entero"

# La elision de vidas cubre UN borrow de entrada: si solo hay uno, el de salida
# sale de el y no hay nada que elegir.  Con dos o mas, el compilador no sabe de
# cual sale -- y esto es lo que NO se hace: callar y quedarse con el primero.
# Un borrow atado al owner equivocado no da un error, da otro valor cuando el
# owner de verdad ya murio.  Se dice que no se sabe, y por que.
