es = "puede abortar (panic)"

# --- lowering / IR (VX3xxx) ---

[VX3001]
en = "{0} of {1} bytes is outside {2}: the object reserves [0, {3}) and the access is [{4}, {5})"
es = "{0} de {1} bytes fuera de {2}: el objeto reserva [0, {3}) y el acceso es [{4}, {5})"

[VX3002]
en = "write"
es = "escritura"

[VX3003]
en = "read"
es = "lectura"

[VX3004]
en = "detected by region analysis: the extent comes from where the object is reserved ({0} bytes) and the access from its offset and width"
es = "detectado por el analisis de regiones: la extension sale de donde se reserva el objeto ({0} bytes) y el acceso, de su desplazamiento y ancho"

[VX3005]
en = "either reserve at least {0} bytes for the object, or keep the access within [0, {1})"
es = "o reserva al menos {0} bytes para el objeto, o manten el acceso dentro de [0, {1})"

[VX3006]
en = "in function '{0}' (the line refers to its own module, which may not be the one being compiled)"
es = "en la funcion '{0}' (la linea es la de su propio modulo, que puede no ser el que se compila)"

# --- modulos / namespaces (VX4xxx) ---

[VX4001]
en = "'{0}' is declared with @Target(\"{1}\"), which does not hold for this target -- that declaration is not available here"
es = "'{0}' esta declarado con @Target(\"{1}\"), que no se cumple en este objetivo -- esa declaracion no esta disponible aqui"

[VX4002]
en = "'{0}' is only declared for other targets ({1}) -- no variant matches the target being compiled"
es = "'{0}' solo esta declarado para otros objetivos ({1}) -- ninguna variante encaja con el objetivo que se esta compilando"

# --- fallos en ejecucion (VX7xxx) ---
#
# Un fallo que nadie captura acaba con el programa, asi que se cuenta igual que
# cualquier otro diagnostico: por codigo y en el idioma de quien lo lee.  El
# texto describe QUE paso, no la constante interna del runtime.

[VX7001]
en = "fatal error: null pointer"
es = "error fatal: puntero nulo"

[VX7002]
en = "fatal error: division by zero"
es = "error fatal: division entre cero"

