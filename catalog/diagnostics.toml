# que se buscaron.  "funcion no declarada" a secas deja fuera justo la mitad que
# el programador esperaba encontrar.  {0} el nombre escrito, {1} la palabra
# clave con la que se declaro el tipo -- `struct` o `class`, que NO se traduce:
# entra como dato --, {2} el tipo del primer argumento.
