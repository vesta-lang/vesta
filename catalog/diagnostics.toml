# --- una funcion del intermedio que llego SIN NOMBRE (VXA073) ---
#
# La cache de hechos referencia cada funcion por el HASH DE SU NOMBRE: es lo
# unico estable entre dos compilaciones, porque el modulo se construye de nuevo
# y las posiciones se mueven.  Una funcion sin nombre no puede tener entrada en
# esa tabla, asi que su codigo se le cobra a TODAS -- correcto, pero pierde la
# granularidad de todo el modulo.
