# --- compilar codigo comptime a bytecode (VXA047-VXA050) ---
#
# El comptime se ejecuta SIEMPRE compilado.  Si no se pudo compilar, eso es un
# fallo del compilador y se DICE: caer a otra via en silencio es como el
# evaluador de AST se quedo dentro tantos anyos.

[VXA047]
en = "the comptime code of '{0}' produced no code when emitting"
es = "el codigo comptime de '{0}' no produjo codigo al emitir"

[VXA048]
en = "the comptime code of '{0}' was rejected by the assembler"
es = "el codigo comptime de '{0}' lo rechazo el ensamblador"

[VXA049]
en = "the bytecode of the comptime code of '{0}' could not be read"
es = "el bytecode del codigo comptime de '{0}' no se pudo leer"

[VXA050]
en = "the comptime machine did not accept the bytecode of '{0}'"
es = "la maquina de compilacion no acepto el bytecode de '{0}'"

# --- el artefacto comptime no se pudo construir (VXA051) ---
#
# Sin el, el codigo comptime que necesita la maquina de compilacion no tiene
# bytecode que ejecutar: se queda diferido y el programa se compila con valores
# de relleno.  Callarselo era el fallo: el sitio tenia un `if (ok) {...}` sin
# `else`, asi que la compilacion seguia como si nada.

[VXA051]
en = "the comptime set of '{0}' could not be assembled, so its compile-time code has no bytecode to run: what depends on it is compiled with placeholder values"
es = "el conjunto comptime de '{0}' no se pudo ensamblar, asi que su codigo de compilacion no tiene bytecode que ejecutar: lo que dependa de el se compila con valores de relleno"

# --- un inject() de un bloque asm se quedo sin resolver (VXA052) ---
#
# El cuerpo de un `asm` se genera ejecutando codigo en compilacion -- hoy, con
# el macro `inject` de `std.comptime`, que NO es del lenguaje: se importa.  Si esa
# ejecucion no llega a ocurrir, el bloque sale VACiO y hasta ahora se compilaba
# igual, sin decir nada: el programa quedaba sin la copia, sin el relleno o sin
# lo que el bloque hiciera, y el sintoma aparecia lejos -- un resultado que no
# cuadra, o un `hlt` a mitad de una funcion de la biblioteca.
#
# Se comprueba sobre el ARTEFACTO QUE SE ENTREGA, no sobre una pasada concreta:
# da igual cuantas veces se compile por dentro, lo que sale no puede llevar un
# bloque sin cuerpo.

[VXA052]
en = "the body of an inline asm block in '{0}' was never generated: the compile-time code that produces it could not run, so the block would be emitted EMPTY"
es = "el cuerpo de un bloque de ensamblador de '{0}' no llego a generarse: el codigo de compilacion que lo produce no se pudo ejecutar, asi que el bloque saldria VACiO"

# --- el ensamblado del artefacto fallo (VXA053) ---
#
# El texto se genero pero ensamblarlo a `.velb` no salio bien.  Se comprobaba el
# codigo de salida solo para los caminos de exito y se devolvia tal cual: la
# orden terminaba sin binario y sin una palabra, indistinguible de un exito para
# quien la llamara.

[VXA053]
en = "assembling '{0}' into a .velb failed (code {1}): no artifact was produced"
es = "ensamblar '{0}' a .velb no salio bien (codigo {1}): no se produjo artefacto"

# Un bloque de ensamblador con operandos del banco ancho, por la via que no
# puede transportarlos: esa via pasa los operandos por una lista de enteros, y
# un valor de 128, 256 o 512 bits no cabe -- ni entra ni sale.
#
# Antes lo que se emitia ahi era un `hlt` pelado, y eso en ejecucion es
# indistinguible de que el programa termine bien: el proceso paraba a mitad de la
# funcion y quien la llamo leia lo que hubiera quedado en R0.  Asi devolvia
# `367_std_memory_variantes` un puntero -- y en otra de sus rutinas, el propio
# byte de relleno -- en lugar de su resultado, sin una queja.

[VX7025]
en = "assembly block with wide-bank operands (xmm/ymm/zmm) cannot run this way: their values do not fit in the integer list the operands travel in, so they neither go in nor come out"
es = "bloque de ensamblador con operandos del banco ancho (xmm/ymm/zmm) no ejecutable por esta via: sus valores no caben en la lista de enteros por la que viajan los operandos, asi que ni entran ni salen"

