# receptor, {1} el nombre escrito tras el punto, {2} el namespace que la trae.
["VX2079"]
en = "no free function '{1}' taking a '{0}' is in scope here, but '{2}' has one.  Either write `{2}.{1}(receiver, ...)`, or bring the name in with `import {2} only {1};` and the dot works"
es = "aqui no hay en ambito ninguna funcion libre '{1}' que tome un '{0}', pero '{2}' trae una.  O la escribes `{2}.{1}(receptor, ...)`, o traes el nombre con `import {2} only {1};` y el punto funciona"

# Igual que VX2079 pero sin cruzar de fichero: un fichero puede declarar varios
# namespaces, y lo que uno declara no esta en ambito desde otro.  El punto no la
# encuentra, y es correcto -- `doble(6)` tampoco vale ahi --, pero la candidata
# esta unas lineas mas arriba en el MISMO fichero, asi que se dice de quien es.
# Aqui no cabe sugerir un `import`: no hay nada que importar, es el mismo
# fichero.  {0} el tipo del receptor, {1} el nombre tras el punto, {2} el
# namespace que la declara.
["VX2080"]
en = "no free function '{1}' taking a '{0}' is in scope here: the one that exists belongs to namespace '{2}', declared in this same file.  Write `{2}.{1}(receiver, ...)`"
es = "aqui no hay en ambito ninguna funcion libre '{1}' que tome un '{0}': la que hay es del namespace '{2}', declarado en este mismo fichero.  Escribela `{2}.{1}(receptor, ...)`"

