# frases sueltas que se enumeran detras del contrato, no oraciones completas.

[VX2010]
en = "reads memory"
es = "lee memoria"

[VX2011]
en = "writes memory"
es = "escribe memoria"

[VX2012]
en = "may fail"
es = "puede fallar"

[VX2013]
