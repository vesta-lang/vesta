# algo suyo.
#
# Antes esto no existia: habia un caso por defecto que daba por leidos y
# escritos todos los operandos, la memoria y las banderas, y ademas marcaba
# barrera.  O sea "no se sabe" con otro nombre.  Con eso, una instruccion sin
# declarar no daba ningun aviso -- solo hacia que el optimizador no tocara
# nada a su alrededor --, y asi llevaban tiempo cuatro operaciones de coma
# flotante fusionada, en silencio.  {0} es lo que falta, {1} el numero de la
# operacion, {2} la arquitectura.

