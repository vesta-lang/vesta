# Hoy no deberia ocurrir: los sitios que construyen una funcion del intermedio
# le ponen nombre (`__cfnthunk_...`, `Clase__metodo`, los prefijos de macro).  Si
# suena, es que aparecio una via nueva que se lo salta -- y callarlo dejaria la
# cache degradandose sola sin que nadie supiera por que.

