[VXW932]
en = "@Hook(exit): this module throws, and an exception does NOT leave through the epilogue: the functions it crosses will not call '{0}'.  Add a @Hook(unwind) if the hook keeps a count of the entries"
es = "@Hook(exit): este modulo lanza excepciones, y una excepcion NO sale por el epilogo: las funciones que atraviesa no llamaran a '{0}'.  Anade un @Hook(unwind) si el gancho lleva cuenta de las entradas"

# --- @Hook: un asm que mueve la pila invalida `call_site` (VXW934) ---
#
# Se puede DECIR porque el bloque no es opaco: la tabla de efectos ya declara
# que `push`/`pop` escriben `rsp`, asi que se sabe cuando el sitio desde el que
# se llamo deja de estar donde el codigo lo va a buscar.  Otros compiladores
# tratan el asm en linea como una barrera y devolverian el valor igual.
[VXW934]
en = "@Hook: the `call_site` of '{0}' is not reliable: the function has an asm block that writes {1}, and the return address is read from the stack. The value will be whatever is at that position"
es = "@Hook: el `call_site` de '{0}' no es fiable: la funcion tiene un bloque asm que escribe {1}, y la direccion de retorno se lee de la pila.  El valor sera lo que haya en esa posicion"

# --- overlays: tramos contiguos y con que lanes se pueden tratar ---
# El tramo dice que los bytes van juntos; estos dicen CON QUE.  Son respuestas
# por ISA porque la respuesta cambia de verdad entre ellas, y dentro de x86-64
# cambia por NIVEL: con `--float-isa sse2` no hay lanes de 64 aunque la
# arquitectura las tenga, y afirmarlas seria emitir lo que el objetivo no admite.
["overlay.lanes_sse2"]
en = "x86-64 at the SSE2 level: the widest lane the target admits is 16 bytes"
es = "x86-64 en el nivel SSE2: la lane mas ancha que admite el objetivo es de 16 bytes"

["overlay.lanes_avx"]
en = "x86-64 with AVX: the target admits lanes of up to 32 bytes"
es = "x86-64 con AVX: el objetivo admite lanes de hasta 32 bytes"

["overlay.lanes_avx512f"]
en = "x86-64 with AVX-512F: the target admits lanes of up to 64 bytes"
es = "x86-64 con AVX-512F: el objetivo admite lanes de hasta 64 bytes"

["overlay.lanes_x86_32"]
en = "x86-32 presents no wide class in the register bank"
es = "x86-32 no presenta clase ancha en el banco de registros"

["overlay.lanes_arm64_baseline"]
en = "the lanes aarch64 makes mandatory in its baseline, which is what can be proven without declaring anything"
es = "las lanes que aarch64 hace obligatorias en su base, que es lo que se puede demostrar sin declarar nada"

["overlay.lanes_velb"]
en = "the wide register bank of the machine itself"
es = "el banco ancho de la propia maquina"

# El suelo de aarch64 NO es su techo, y decir que si lo es seria peor que
# callarse: quien lo lea dejaria de ensanchar donde si se puede.
["overlay.arm64_wide_lane_axis_missing"]
en = "aarch64 admits wider lanes and their width CAN be pinned in the binary, the same way `--float-isa` pins it on x86; what is missing is the axis to declare it -- BackendCaps only carries x86 bits and descriptor_arm64 does not look at the caps it receives"
es = "aarch64 admite lanes mas anchas y su ancho SI se puede fijar en el binario, igual que `--float-isa` lo fija en x86; lo que falta es el eje para declararlo -- BackendCaps solo lleva bits de x86 y descriptor_arm64 no mira las capacidades que recibe"

["overlay.no_wide_bank"]
en = "this ISA presents no wide lane in its register bank, so the run cannot be treated with words wider than a field"
es = "esta ISA no presenta ninguna lane ancha en su banco, asi que el tramo no se puede tratar con palabras mas anchas que un campo"

["overlay.run_shorter_than_lane"]
en = "the run is shorter than the narrowest lane of this ISA: a wider word would touch bytes behind it, which do not belong to this view"
es = "el tramo es mas corto que la lane mas estrecha de esta ISA: una palabra mas ancha tocaria bytes de detras, que no son de esta vista"

["overlay.wider_lane_not_declarable"]
en = "the width proven here is the FLOOR, not the ceiling: this ISA admits wider lanes and there is nothing yet to declare which"
es = "el ancho demostrado aqui es el SUELO, no el techo: esta ISA admite lanes mas anchas y todavia no hay con que declarar cuales"

# --- movimiento de bloque escrito EN RECTA (sin bucle) ---
# Codigo propio y no el del bucle: la clase de conocimiento es la misma, pero
# el sujeto no.  Con `bulk.fill` el mensaje decia "este bucle escribe..." sobre
# una tirada de asignaciones donde no hay ningun bucle, y sus dos numeros
# (elementos y ancho) ahi no significan nada: aqui son bytes y el byte que se
# repite, porque en recta las direcciones son constantes y la longitud se sabe.
["bulk.fill_run"]
en = "these adjacent writes tile a contiguous run of {0} bytes with the byte 0x{1}: together they are a block fill"
es = "estas escrituras seguidas embaldosan un tramo contiguo de {0} bytes con el byte 0x{1}: juntas son un relleno de bloque"

["bulk.copy_run"]
en = "these adjacent accesses tile a contiguous run of {0} bytes: together they are a block copy"
es = "estos accesos seguidos embaldosan un tramo contiguo de {0} bytes: juntos son una copia de bloque"

# --- por que un grupo de escrituras seguidas NO se junta ---
# Tres casos con tres salidas distintas.  El primero es el unico que es una
# LIMITACION: hay una copia de bloque ahi delante y lo que falta es el hecho de
# que las dos regiones no se solapan; los otros dos son "aqui no hay nada".
["bulk.would_be_a_copy_needs_no_overlap"]
en = "these adjacent accesses ARE a block copy, but turning them into one needs proof that the two regions do not overlap -- with two pointers arriving as parameters that is not known here, and assuming it would give a different result when they do overlap"
es = "estos accesos seguidos SI son una copia de bloque, pero convertirlos en una exige demostrar que las dos regiones no se solapan -- con dos punteros que llegan como parametros eso no se sabe aqui, y suponerlo daria otro resultado cuando de verdad se solapen"

["bulk.stored_value_computed"]
en = "the value written is computed, not the same byte over and over: there is no block operation to reduce this to"
es = "el valor que se escribe es calculado, no el mismo byte una y otra vez: no hay operacion de bloque a la que reducir esto"

["bulk.stored_value_not_a_byte"]
en = "the constant written does not fit in one byte: a block fill repeats a single byte, and this one does not"
es = "la constante que se escribe no cabe en un byte: un relleno de bloque repite UN byte, y esta no lo es"

["bulk.run_in_machine_memory"]
en = "the run is in the machine's own memory, not the host's: the IR distinguishes the two block operations, but the JIT emits the host one for both, so reducing this would write somewhere else"
es = "el tramo esta en la memoria de la propia maquina, no en la del anfitrion: el intermedio distingue las dos operaciones de bloque, pero el JIT emite la del anfitrion para las dos, asi que reducirlo escribiria en otro sitio"

# --- lo que cada parametro promete de su region, y lo que no ---
# Varias formas del lenguaje escriben en el mismo eje: `in`/`out`/`inout`,
# `borrow`/`borrow_mut`, `unique<T>` y `nonnull`.  Lo que las separa no es lo que
# afirman sino QUIEN responde: la direccion es un contrato del que llama y hay
# que comprobarla en cada sitio de llamada; el resto lo hace cumplir el
# compilador.
["param.may_read"]
en = "may READ what it points at"
es = "puede LEER lo que apunta"

["param.may_write"]
en = "may WRITE what it points at"
es = "puede ESCRIBIR lo que apunta"

["param.exclusive_call"]
en = "its region is reached by no OTHER PARAMETER of the same call, so a read through another one may move ahead of a write through this one"
es = "su region no la alcanza NINGUN OTRO PARAMETRO de la misma llamada, asi que una lectura por otro puede adelantar a una escritura por este"

["param.exclusive_run"]
en = "in this execution nobody else reaches that region: not another thread, not a pointer saved earlier. It is the one that answers whether two writes can be a race and whether two regions share a cache line"
es = "en esta ejecucion no alcanza esa region nadie mas: ni otro hilo, ni un puntero guardado antes.  Es la que responde a si dos escrituras pueden ser una carrera y a si dos regiones comparten linea de cache"

["param.nonnull"]
en = "it is not null"
es = "no es nula"

["param.no_escape"]
en = "the pointer does not outlive the call"
es = "el puntero no sobrevive a la llamada"

# Un hueco NUESTRO, no un error del programa: el intermedio lleva una operacion
# que el emisor de bytecode no sabe emitir, casi siempre porque se anadio y se
# olvido su reparto.  Antes se dejaba un comentario y un `NOP`, que no es lo
# conservador: la instruccion tenia que PRODUCIR un valor y el `NOP` no produce
# ninguno, asi que lo que salia no era un error sino OTRO RESULTADO.
# El depurador solo ve lo que INTERPRETA: el codigo que el JIT compila no pasa
# por su gancho, asi que un punto de ruptura dentro de una funcion compilada no
# saltaria NUNCA y sin decir nada.  Se apaga el JIT y se dice, en vez de dejar
# que el usuario crea que su punto de ruptura no se cumple.
["debug.jit_off"]
en = "the JIT is off while the debugger is attached: compiled code does not go through its hook, so a breakpoint inside a compiled function would never fire. Execution is interpreted and therefore slower"
es = "el JIT queda apagado mientras el depurador este conectado: el codigo compilado no pasa por su gancho, asi que un punto de ruptura dentro de una funcion compilada no saltaria nunca.  La ejecucion va interpretada y por tanto mas lenta"

["emit.unsupported_op"]
en = "the bytecode emitter does not know how to emit '{2}' (function '{0}', line {1})"
es = "el emisor de bytecode no sabe emitir '{2}' (funcion '{0}', linea {1})"

# Una funcion `comptime` con ensamblador se EJECUTA al compilar, en la maquina
# de compilacion.  Cuando su bytecode ya esta cargado y aun asi no se puede
# invocar, lo que quedaba era un CERO horneado en el binario, sin un solo
# diagnostico: el programa devolvia otro valor y nadie se enteraba.  Los dos
# motivos se separan porque lo que hay que hacer es distinto -- uno es del
# programa (un argumento que no es constante) y el otro es del compilador.
["comptime.exec_failed"]
en = "comptime function '{0}' could not be run in the compile-time machine; its result would be baked as 0"
es = "la funcion comptime '{0}' no se pudo ejecutar en la maquina de compilacion; su resultado quedaria horneado como 0"
["comptime.arg_not_const"]
en = "argument of comptime function '{0}' is not known at compile time, so the function cannot be run"
es = "un argumento de la funcion comptime '{0}' no se conoce al compilar, asi que la funcion no se puede ejecutar"

# POR QUE no se pudo ejecutar.  Un "no se pudo" a secas no se puede diagnosticar
# ni arreglar: son cinco situaciones distintas y solo una de ellas -- la
# primera -- es normal.  Las escribe el unico sitio que las distingue, la
# invocacion misma.
["comptime.why.no_machine"]
en = "the compile-time machine is not loaded yet (this is the first pass; the second one resolves it)"
es = "la maquina de compilacion todavia no esta cargada (es la primera pasada; la segunda lo resuelve)"
["comptime.why.not_registered"]
en = "'{0}' is not in the compile-time machine, although other functions are: it did not make it into the comptime set"
es = "'{0}' no esta en la maquina de compilacion, aunque si hay otras funciones: no entro en el conjunto comptime"
["comptime.why.no_address"]
en = "'{0}' is in the compile-time machine with no resolved address"
es = "'{0}' esta en la maquina de compilacion sin direccion resuelta"
["comptime.why.too_many_args"]
en = "'{0}' takes more than 12 arguments, which the compile-time calling convention does not carry"
es = "'{0}' lleva mas de 12 argumentos, que es lo que la convencion de llamada al compilar no puede pasar"
["comptime.why.trapped"]
en = "'{0}' died while running in the compile-time machine"
es = "'{0}' murio al ejecutarse en la maquina de compilacion"
["comptime.why.no_marshal"]
en = "the aggregate arguments of '{0}' could not be handed to the compile-time machine, which is not ready yet"
es = "los argumentos agregados de '{0}' no se pudieron pasar a la maquina de compilacion, que aun no esta lista"
["comptime.why.arg_deferred"]
en = "an argument of '{0}' is itself pending, so the whole call is deferred"
es = "un argumento de '{0}' esta a su vez pendiente, asi que se difiere la llamada entera"

# Una llamada a una funcion `comptime` dentro de un bloque de ensamblador.  El
# mensaje nombra la funcion en vez de dar por hecho que se llama de una manera
# concreta: cualquier `comptime` que devuelva `string` vale ahi.
# El informe de una CAIDA DEL PROCESO.  Va entero por catalogo, y aqui importa
# mas que en ningun otro sitio: es lo unico que quien se encuentra el fallo va a
# poder leer, y con frecuencia lo unico que va a poder pegar en un informe.
# La exclusividad de un prestamo, incumplida CRUZANDO una llamada.  El
# comprobador del AST la hace cumplir por nombre y dentro de una funcion; esto es
# lo que se le escapa: dos prestamos exclusivos de la misma region que llegan por
# separado.  El mensaje lleva la LLAMADA que lo demuestra, porque sin ella seria
# una acusacion sin nada detras.
["VX2053"]
en = "parameter {0} of '{1}' promises that no other parameter reaches its region, and parameter {2} reaches the same memory"
es = "el parametro {0} de '{1}' promete que ningun otro parametro alcanza su region, y el parametro {2} alcanza esa misma memoria"
["VX2054"]
en = "the call at line {0} passes both, and there they are the same memory"
es = "la llamada de la linea {0} le pasa los dos, y ahi son la misma memoria"
["VX2055"]
en = "two exclusive borrows of one region cannot be alive at once: end one before taking the other, or use 'borrow<T>' if reading is enough"
es = "no pueden estar vivos dos prestamos exclusivos de una misma region: termina uno antes de tomar el otro, o usa 'borrow<T>' si con leer basta"
# La misma promesa puede venir de dos sitios y la salida NO es la misma, asi que
# tampoco puede serlo la nota: una la deriva el compilador del TIPO -- ahi se
# habla de prestamos, arriba -- y la otra la ESCRIBIO el programador con la
# direccion del parametro.  A quien puso `out` decirle que termine un prestamo
# lo manda a buscar algo que no existe en su programa.
["VX2056"]
en = "the direction declared on parameter {0} asserts that its region is reached only through it; drop the declaration, or do not pass overlapping memory at that call"
es = "la direccion declarada en el parametro {0} afirma que su region solo se alcanza por el; quita la declaracion, o no le pases memoria solapada en esa llamada"
# Cuando el choque NO se demostro.  El error de arriba dice "es la misma
# memoria"; si en realidad es "no he podido separarlos", hay que decirlo, y
# decir QUE pieza falta: lo primero se arregla cambiando el programa, lo segundo
# a lo mejor no hay nada que arreglar.
["VX2057"]
en = "these two were not separated because the index is not a compile-time constant: with a runtime index it could name any element"
es = "no se han podido separar porque el indice no es constante al compilar: con un indice de ejecucion puede nombrar cualquier elemento"
["VX2058"]
en = "these two were not separated because the region this pointer names is not resolved at this level; a 'borrow<T>', 'unique<T>' or 'shared<T>' does say whose memory it is"
es = "no se han podido separar porque la region que nombra este puntero no esta resuelta en este nivel; un 'borrow<T>', un 'unique<T>' o un 'shared<T>' si dicen de quien es la memoria"
# Y CUAL es el prestamo que estorba, cuando no es el mismo lugar: `p` bloqueando
# a `p.a` se lee de otra manera si se dice cual de los dos contiene al otro.
["VX2059"]
en = "the borrow that gets in the way is of '{0}', which covers '{1}'"
es = "el prestamo que estorba es de '{0}', que abarca a '{1}'"
# Repetir el NOMBRE de un metodo es legitimo -- es una sobrecarga --; repetir
# nombre Y parametros no, porque entonces no hay nada que distinga a uno del
# otro.  Una sola entrada para el struct y para la clase: lo que va dentro es el
# nombre del TIPO, que es un dato del usuario, asi que la palabra "struct" o
# "clase" no hace falta y no hay dos mensajes que mantener.
["VX2060"]
en = "'{0}' already declares a method '{1}' with those same parameters"
es = "'{0}' ya declara un metodo '{1}' con esos mismos parametros"
# El constructor va aparte y no como un metodo llamado "<constructor>": esa
# palabra habria que traducirla, y lo que entra como dato NO se traduce nunca.
["VX2061"]
en = "'{0}' already declares a constructor with those same parameters"
es = "'{0}' ya declara un constructor con esos mismos parametros"
# Un `impl` AnyADE metodos, no los sustituye: el tipo ya tiene uno que se llama
# igual y toma lo mismo.  {0} el metodo, {1} el tipo.
["VX2063"]
en = "'{1}' already has a method '{0}' with those parameters; an 'impl' adds methods, it cannot redefine one"
es = "'{1}' ya tiene un metodo '{0}' con esos parametros; un 'impl' anyade metodos, no puede redefinir uno"
# Y al construir: se escribio una llamada que ningun constructor acepta.  El
# nombre del tipo entra como dato; la lista de los que hay la da el editor.
["VX2064"]
en = "no constructor of '{0}' takes those arguments"
es = "ningun constructor de '{0}' admite esos argumentos"
# Un constructor `comptime` construye AL COMPILAR, asi que sus argumentos
# tienen que saberse al compilar.  Callarse este daba lo peor que puede dar:
# el struct salia a ceros -- o con lo que hubiera en el bufer -- y el programa
# seguia con un valor que nadie escribio.  {0} el tipo, {1} que argumento es.
["VX2065"]
en = "'{0}' is built at compile time, and its argument {1} is not known then"
es = "'{0}' se construye al compilar, y su argumento {1} no se sabe entonces"
# Y que el constructor este cargado y aun asi no llegue a construir es un fallo
# del COMPILADOR, no del programa.  Se dice igual: lo que no se puede es
# entregar un struct con lo que hubiera en el bufer.  {0} el tipo.
["VX2066"]
en = "'{0}' could not be built at compile time: its constructor is loaded and did not run"
es = "'{0}' no se ha podido construir al compilar: su constructor esta cargado y no llego a ejecutarse"
# Buscar un metodo POR NOMBRE cuando ese nombre lo comparten varios.  Se
# contestaba con uno cualquiera; ahora se dice que la pregunta no tiene una sola
# respuesta y por donde se sale.  {0} la clase, {1} el nombre.
["VX2067"]
en = "'{1}' does not name one method of '{0}': several share it.  Walk them with getMethods/getMethodAt, where each overload has its own index"
es = "'{1}' no nombra a un solo metodo de '{0}': lo comparten varios.  Recorrelos con getMethods/getMethodAt, donde cada sobrecarga tiene su propio indice"
# Un nombre de tipo es UNO.  {1} es la palabra clave con la que se declaro el
# que ya lo tenia -- `struct`, `class` o `enum` --, y como es palabra clave del
# lenguaje NO se traduce: entra como dato.
["VX2062"]
en = "the type name '{0}' is already taken by a '{1}' declared earlier"
es = "el nombre de tipo '{0}' ya lo tiene un '{1}' declarado antes"
# Ni frontera ni ignorancia: el valor no esta en el codigo que se mira.  La
# tabla de valores no encoge cuando el optimizador borra una instruccion, asi
# que la ranura sobrevive vacia -- y contestarle algo es trabajo sobre un dato
# muerto.
["memory.value_not_here"]
en = "this value is not in the code being looked at: nothing defines it and nothing reads it, so it was left behind by a pass that removed its instruction"
es = "este valor no esta en el codigo que se mira: nada lo define y nadie lo lee, asi que lo dejo atras un pase que quito su instruccion"

