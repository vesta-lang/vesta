# `$`: dejarla seguir daba "nombre no declarado: 'geo'", senyalando el primer
# segmento y sin mencionar lo unico que el usuario escribio de mas.
# {0} lo que se escribio tras el `$`, {1} el nombre de la funcion.
["VX2081"]
en = "'{0}' after '$' is not a namespace in scope.  `x.{1}$<namespace>(...)` names which '{1}' to call, so what follows the '$' has to be a namespace this file declares or imports"
es = "'{0}', tras el '$', no es un namespace en ambito.  `x.{1}$<namespace>(...)` dice a que '{1}' se llama, asi que lo que sigue al '$' tiene que ser un namespace que este fichero declare o importe"

# El trampolin de `as_native_callback` copia SOLO el banco entero, y la
# convencion nativa pasa los flotantes por los registros vectoriales.  Sin esta
# comprobacion el programa compilaba y el callback leia basura donde esperaba un
# numero: un resultado equivocado en vez de un error, que es lo que no se admite.
# {0} el nombre de la funcion, {1} que parte de su firma es flotante -- y ese
# {1} sale de VX2083/VX2084, no escrito aqui: un fragmento en castellano dentro
# del mensaje ingles se ve a la primera.
# `find_type("Punto")` se resuelve al compilar a la direccion de la ficha.  Con
# una cadena calculada en ejecucion haria falta un resolutor que recorra la
# tabla por nombre, y no lo hay.  El mensaje lo dice asi: nombrar la fase
# interna en la que se hara no le sirve a quien lee el error.
["VX2085"]
en = "'find_type' resolves the type at compile time, so its argument has to be a string literal: looking one up by a name computed at run time would need a resolver that walks the table, and there is none"
es = "'find_type' resuelve el tipo al compilar, asi que su argumento tiene que ser un literal de cadena: buscarlo por un nombre calculado en ejecucion pediria un resolutor que recorra la tabla, y no lo hay"

