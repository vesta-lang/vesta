# Catalogo de DOCUMENTACION de los builtins del lenguaje.
#
# Es lo que el editor ensenya al pasar el raton por encima de `type.size` o
# `println`, y lo que acompanya a cada nombre en el autocompletado.
#
# Vive aqui y no escrito a mano en el servidor de lenguaje por la misma razon
# que los diagnosticos: **es texto que LEE una persona**, y una persona lee en
# su idioma.  Con la doc dentro del `.cpp` solo habia una version -- la
# espanyola -- y anyadir ingles habria sido duplicar la tabla entera.
#
# Cada entrada es el NOMBRE del builtin, que es lo permanente: la redaccion
# puede cambiar sin que nada mas se entere.
#
#   sig     la firma, IGUAL en todos los idiomas -- es codigo, no prosa --.
#   en/es   la explicacion, una por idioma.
#
# Los NOMBRES DE LAS RANURAS no estan aqui: salen de `vx/builtin_params.h`,
# que es la misma tabla que lee el comprobador al registrar el builtin.  Y no
# es por ahorrar: desde que una llamada puede nombrarlas (`f(.a = 3)`) el
# nombre de una ranura es parte del CONTRATO, asi que tenerlo en dos sitios
# significa que un dia el editor sugiere algo que no compila.
#
# ANADIR UN IDIOMA: se anyade su codigo ISO a `languages` y su clave a cada
# entrada, y se regenera con tools/import/gen_builtin_docs.py.  NO se traducen
# NUNCA los nombres de builtin, los tipos ni los identificadores del usuario.

[meta]
# El ORDEN fija el indice interno de idioma (0 = primero = fallback).
languages = ["en", "es"]

# --- E/S (vesta_io) ---

