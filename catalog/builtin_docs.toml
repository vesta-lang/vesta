# --- Lo que se puede LLAMAR desde aqui (scoped.method.*) ---
#
# Distinto de `method.*`: con llamada uniforme, sobre un tipo tambien se puede
# llamar una funcion LIBRE que este fichero alcance, y eso depende de lo que
# importe.  De ahi el `scoped` del nombre -- la respuesta confiesa que depende
# del ambito en vez de dejar que se descubra --.

["scoped.method.count"]
sig = "scoped.method.count<T>() -> u32"
en = "How many things can be CALLED on T from here: its own methods plus the free functions reachable through uniform call syntax."
es = "Cuantas cosas se pueden LLAMAR sobre T desde aqui: sus metodos mas las funciones libres alcanzables por llamada uniforme."

["scoped.method.has"]
sig = "scoped.method.has<T>(name: string) -> bool"
en = "Whether something with that name can be called on T, be it a method of its own or a reachable free function."
es = "Si sobre T se puede llamar algo con ese nombre, sea metodo suyo o funcion libre alcanzable."

["scoped.method.name"]
sig = "scoped.method.name<T>(idx: int) -> string"
en = "Name of the idx-th reachable entry.  The order is stable across compilations (by name, then by origin)."
es = "Nombre de la entrada idx-esima de lo alcanzable.  El orden es estable entre compilaciones (por nombre, y a igualdad por origen)."

["scoped.method.origin"]
sig = "scoped.method.origin<T>(idx: int) -> string"
en = "Which namespace the idx-th entry comes from.  EMPTY if it is a method of the type itself.  This is what makes a clash between two namespaces debuggable."
es = "De que namespace viene la entrada idx-esima.  VACIO si es un metodo del propio tipo.  Es lo que hace depurable un choque entre dos namespaces que ofrecen el mismo nombre."

["scoped.method.arity"]
sig = "scoped.method.arity<T>(idx: int) -> u32"
en = "How many parameters it takes, RECEIVER INCLUDED: also where `this` is implicit, so a method and a free function read the same."
es = "Cuantos parametros tiene, RECEPTOR INCLUIDO: tambien donde `this` es implicito, para que un metodo y una libre se lean igual."

["scoped.method.result"]
sig = "scoped.method.result<T>(idx: int) -> Type"
en = "What it returns, as a TYPE rather than a string: it goes straight back where a type is expected (`type.size<...>()`)."
es = "Lo que devuelve, como TIPO y no como cadena: se vuelve a meter donde se pide un tipo (`type.size<...>()`)."

["scoped.method.param"]
sig = "scoped.method.param<T>(idx: int, j: int) -> Type"
en = "The j-th parameter of entry idx.  Parameter 0 is ALWAYS the receiver."
es = "El parametro j-esimo de la entrada idx.  El 0 es SIEMPRE el receptor."

["scoped.method.each"]
sig = "scoped.method.each<T>(cb: fn(string, string)) -> void"
en = "Walks everything reachable, passing name and origin.  It builds no loop: the body is repeated once per entry."
es = "Recorre lo alcanzable pasando nombre y origen.  No monta ningun bucle: el cuerpo se repite una vez por entrada."

